plugins {
	// Use 'java-library' for reusable components
	id 'java-library'

	// Plugin required to publish artifacts (JAR files)
	id 'maven-publish'
}

group = 'com.core.v1'
version = '1.0.0'
description = 'Reusable Core Java Library'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

/**
 * Defines versions for dependencies in a central location
 * to improve maintainability and consistency.
 */
ext {
	set('lombokVersion', '1.18.32')
	set('commonsLang3Version', '3.14.0')
	set('logstashLogbackVersion', '7.4')
	set('jakartaPersistenceVersion', '3.1.0')
	set('hibernateVersion', '6.5.2.Final')
	set('pojomaticVersion', '2.2.0')
	set('jacksonVersion', '2.17.1')
	set('junitVersion', '5.10.2')
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
	implementation "org.pojomatic:pojomatic-all:${pojomaticVersion}"
	implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

	// Use Jakarta Persistence API for modern Java (Java 17+)
	implementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceVersion}"
	implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"

	// Testing dependencies
	testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

// ----------------------------------------------------
// PUBLISHING CONFIGURATION
// This block defines the artifact (JAR) and where to put it (local repository)
// ----------------------------------------------------
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	// Use the standard mavenLocal() repository to enable the 'publishToMavenLocal' task.
	repositories {
		mavenLocal()
	}
}

// Set up the standard testing platform
tasks.named('test') {
	useJUnitPlatform()
}
