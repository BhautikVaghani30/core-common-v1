plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
	id 'maven-publish'
}

group = 'com.core.v1'
version = '1.0.0'
description = 'Common utility library for Spring Boot and Java projects'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}
ext {
	set('commons-lang3.version', '3.12.0')
}
dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework:spring-core'

	// Annotation Processors
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Common Libraries
	implementation "org.apache.commons:commons-lang3:${property('commons-lang3.version')}"
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// Persistence
	implementation 'javax.persistence:javax.persistence-api:2.2'
	implementation 'org.hibernate:hibernate-core:5.6.14.Final'

	// Other
	implementation 'org.pojomatic:pojomatic-all:2.2.0'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			groupId = 'com.core.v1'
			artifactId = 'common'
			version = '1.0.0'

			pom {
				name = 'Common Library'
				description = 'Common utility library for Spring Boot and Java projects'
				url = 'https://example.com/common'
			}
		}
	}
	repositories {
		mavenLocal()
	}
}
