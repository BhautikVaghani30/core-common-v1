plugins {
    // Use alias from libs.versions.toml for cleaner plugin management
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.maven.publish)
    id 'java-library'
}

group = 'com.core.v1'
version = '1.0.0'
description = 'Core Java Library with Spring Boot dependencies'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// To build a library, the bootJar task should be disabled.
// The standard 'jar' task will create the library JAR.
bootJar {
    enabled = false
}
jar {
    enabled = true
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    // The 'api' configuration exposes these dependencies to consumers of this library.
    api libs.spring.boot.starter.web
    api libs.spring.boot.starter.webflux
    api libs.spring.boot.starter.aop
    // spring-boot-starter-data-jpa correctly brings in Jakarta Persistence and Hibernate for Spring Boot 3
    api libs.spring.boot.starter.data.jpa

    // Annotation Processors
    // Versions for lombok and spring-boot-configuration-processor are managed by the Spring Boot BOM
    annotationProcessor libs.spring.boot.configuration.processor
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Common Libraries
    implementation libs.commons.lang3
    implementation libs.logstash.logback
    implementation libs.pojomatic

    // Testing
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.reactor.test
}

// ----------------------------------------------------
// PUBLISHING CONFIGURATION
// This block defines the artifact (JAR) and where to put it (local repository)
// ----------------------------------------------------
publishing {
    publications {
        mavenJava(MavenPublication) {
            // The 'java-library' plugin provides the 'java' component which includes API and implementation details.
            from components.java
            // Add metadata to the published POM file for better discoverability
            pom.withXml { asNode().appendNode('description', project.description) }
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
