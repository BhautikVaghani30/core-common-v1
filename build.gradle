plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'jacoco'
    id 'maven-publish'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

apply from: "${project.rootDir}/gradle/jacoco.gradle"

group = project.property('projectGroup')
version = project.property('projectVersion')

java {
    sourceCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}


tasks.register('sourceJar', Jar) {
    from sourceSets.main.allJava
    archiveClassifier = "sources"
}

dependencies {
    // Spring Boot - versions managed by the Spring Boot Gradle plugin
    implementation(libs.spring.boot.starter.webflux)
    implementation(libs.spring.boot.starter.aop)

    // implementation(libs.spring.boot.starter.data.jpa)
    annotationProcessor(libs.spring.boot.configuration.processor)

    // Lombok
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)

    // JSR305 Annotations
    compileOnly(libs.findbugs.jsr305)

    // Other libraries
    implementation(libs.commons.lang3)
    implementation(libs.logstash.logback)
    implementation(libs.pojomatic)

    // Testing
    testImplementation(libs.spring.boot.starter.test)
    testImplementation(libs.reactor.test)
}

// ----------------------------------------------------
// PUBLISHING CONFIGURATION
// This block defines the artifact (JAR) and where to put it (local repository)
// ----------------------------------------------------
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version
            from components.java
            artifact sourceJar

            pom {
                name = project.property('pomName')
                description = project.property('pomDescription')
                url = project.property('pomUrl')
                licenses {
                    license {
                        name = project.property('pomLicenseName')
                        url = project.property('pomLicenseUrl')
                    }
                }
                developers {
                    developer {
                        id = project.property('pomDeveloperId')
                        name = project.property('pomDeveloperName')
                        email = project.property('pomDeveloperEmail')
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal()
    }
}


jar {
    archiveBaseName.set(project.name)
    archiveClassifier.set('')

    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked"
    options.encoding = 'UTF-8'
}