# ===================================================================
# CORE APPLICATION PROPERTIES
# ===================================================================
# Spring Boot application name
spring.application.name=common
# Default active profile
spring.profiles.active=default
# Default profile group for orchestration pooling
spring.profiles.group.default=orchpooling
# ===================================================================
# SERVER PROPERTIES
# ===================================================================
# Server HTTP port. Can be overridden by environment variable SERVER_PORT.
server.port=${SERVER_PORT:7077}
# ===================================================================
# LOGGING PROPERTIES
# ===================================================================
# Set the logging level for the core application package to DEBUG
logging.level.com.core.v1=DEBUG
# ===================================================================
# CUSTOM APPLICATION PROPERTIES
# ===================================================================
# --- Audit Properties ---
# A comma-separated list of error codes that should be included in audit logs.
core.audit.error.messages=SOME_ERROR_CODE,ANOTHER_ERROR_CODE
# --- Payment Properties ---
# Defines the payment methods available for the US region.
paymentproperties.us.allPaymentMethods=creditCard
spring.main.web-application-type=reactive